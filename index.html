<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rotina de Estudos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap">
<style>
:root{color-scheme:dark;--bg:#100e0c;--hd:#1d1914;--card:#181818;--card2:#222;--tx:#fff;--mu:#9a958c;--gold:#d2a96b;--gold2:#8f6f3e;--bd:#2b2823;--ok:#22c55e;--tr:#e6e6e6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(900px 400px at 80% -10%,#2a2113 0,transparent 60%),var(--bg);color:var(--tx);font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4;padding-left:230px}
.side{position:fixed;left:0;top:0;bottom:0;width:230px;background:var(--hd);border-right:1px solid var(--gold2);padding:calc(22px + env(safe-area-inset-top,0px)) 14px 22px;display:flex;flex-direction:column;gap:6px;z-index:5}
.logo{font-weight:900;font-size:1.4rem;letter-spacing:.04em;padding:0 10px 18px}.logo span{color:var(--gold)}
.logo small{display:block;font-size:.55rem;font-weight:500;letter-spacing:.25em;color:var(--mu)}
.side a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:var(--mu);text-decoration:none;font-weight:700;font-size:.92rem;letter-spacing:.03em;cursor:pointer;transition:.2s}
.side a:hover{color:var(--tx);background:var(--card2)}
.side a.on{color:#1a1409;background:var(--gold)}
.side a i{font-style:normal;font-size:1.1rem;width:20px;text-align:center}
@media(max-width:800px){
 body{padding-left:0;padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
 .side{top:auto;width:100%;flex-direction:row;border-right:0;border-top:1px solid var(--gold2);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));justify-content:space-around}
 .logo{display:none}.side a{flex:1;flex-direction:column;gap:2px;font-size:.72rem;padding:8px;justify-content:center}
}
main{max-width:1100px;margin:0 auto;padding:26px 18px 48px}
.page{display:none}.page.on{display:block}
h1{margin:0 0 4px;font-size:1.5rem;font-weight:900;text-transform:uppercase;letter-spacing:.03em}
.mu{color:var(--mu);font-size:.88rem}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px}
.hero{display:grid;grid-template-columns:1fr 1.4fr;gap:16px;margin:18px 0 22px}
@media(max-width:720px){.hero{grid-template-columns:1fr}}
.dt{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.dt label{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);font-weight:700;width:100%}
input[type=date]{font:inherit;background:var(--card2);color:var(--tx);border:1px solid var(--gold2);border-radius:12px;padding:10px 12px;color-scheme:dark}
.range{font-size:.9rem;color:var(--mu);margin-top:10px}.range b{color:var(--tx)}
.ring{display:flex;align-items:center;gap:20px;margin-top:16px}
.rw{position:relative;width:110px;height:110px;flex:none}
.rw svg{transform:rotate(-90deg)}.rw b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.5rem;font-weight:900;color:var(--gold)}
.big{font-size:2rem;font-weight:900}.big small{font-size:1rem;color:var(--mu);font-weight:400}
.prog{display:flex;justify-content:space-between;font-size:.9rem;color:var(--mu);margin:14px 0 6px}.prog b{color:var(--tx)}
.bar{height:8px;background:var(--tr);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:99px;transition:width .4s}
.bar i.full{background:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.day{background:var(--card);border:1px solid var(--bd);border-radius:20px;overflow:hidden;transition:transform .2s,border-color .2s}
.day:hover{transform:translateY(-3px);border-color:var(--gold2)}
.day.today{border-color:var(--gold)}.day.off{opacity:.35;pointer-events:none}
.ban{height:96px;padding:16px 18px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(135deg,#2c2416 0,#15120e 60%,#0d0c0a);border-bottom:1px solid var(--bd);position:relative;overflow:hidden}
.ban:after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border:1px solid rgba(210,169,107,.25);border-radius:50%}
.ban small{font-size:.65rem;letter-spacing:.25em;color:var(--mu);font-weight:500}
.ban h2{margin:0;font-size:1.6rem;font-weight:300;letter-spacing:.06em;text-transform:uppercase}
.ban h2 em{font-style:normal;font-weight:900;color:var(--gold)}
.tag{position:absolute;right:14px;top:14px;font-size:.65rem;font-weight:700;background:var(--gold);color:#1a1409;border-radius:99px;padding:3px 10px;letter-spacing:.06em;z-index:1}
.body{padding:18px}
.mat{font-size:1.15rem;font-weight:700;line-height:1.3;margin:0 0 2px}.mat b{font-weight:900}
.info{display:flex;gap:6px;align-items:center;color:var(--gold);font-size:.9rem;margin:6px 0 12px}
.blk{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--mu);margin:14px 0 6px}.blk b{color:var(--gold)}
label.s{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--card2);border:1px solid transparent;border-radius:12px;margin:6px 0;cursor:pointer;min-height:48px;transition:.2s}
label.s:hover{border-color:var(--gold2)}
label.s:has(input:checked){background:rgba(210,169,107,.12);border-color:var(--gold)}
label.s input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:2px solid var(--gold2);border-radius:7px;flex:none;display:grid;place-items:center;cursor:pointer;margin:0}
label.s input:checked{background:var(--gold);border-color:var(--gold)}
label.s input:checked:after{content:"";width:6px;height:11px;border:solid #1a1409;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
label.s .c{flex:1;min-width:0}.t{font-weight:500}.sj{display:block;font-size:.78rem;color:var(--mu)}
.d{color:var(--mu);font-size:.8rem;white-space:nowrap}
.foot{margin-top:22px}
button{font:inherit;font-weight:700;border:1px solid var(--gold2);background:transparent;color:var(--gold);border-radius:12px;padding:9px 16px;cursor:pointer;transition:.2s}
button:hover{background:rgba(210,169,107,.12)}button.armed{background:#b91c1c;border-color:#b91c1c;color:#fff}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:18px 0}
.sum .panel{padding:16px 18px}.sum b{display:block;font-size:1.7rem;font-weight:900;color:var(--gold)}
.chart{display:flex;align-items:flex-end;gap:10px;height:130px;margin-top:14px;overflow-x:auto}
.chart div{flex:1;min-width:34px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.65rem;color:var(--mu);gap:4px}
.chart i{display:block;width:100%;background:linear-gradient(0deg,var(--gold2),var(--gold));border-radius:6px 6px 0 0;min-height:3px}
.chart i.full{background:var(--ok)}
.wk{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;margin-top:12px}
.wk h3{margin:0;font-size:1.05rem;font-weight:900}
.wk .bar{grid-column:1/-1}.badge{font-size:.65rem;font-weight:700;background:var(--gold);color:#1a1409;border-radius:99px;padding:2px 9px;margin-left:8px;vertical-align:middle}
.acts{display:flex;gap:8px}
.empty{text-align:center;color:var(--mu);padding:30px}
</style>
</head>
<body>
<nav class="side">
  <div class="logo"><span>▲</span> ESTUDOS<small>ROTINA SEMANAL</small></div>
  <a data-p="rotina" class="on"><i>▦</i>Rotina</a>
  <a data-p="historico"><i>↺</i>Histórico</a>
</nav>

<main>
<section class="page on" id="p-rotina">
  <h1>Minha semana</h1>
  <p class="mu" style="margin:0">Marque cada bloco concluído.</p>
  <section class="hero">
    <div class="panel">
      <div class="dt"><label for="ini">Dia inicial da semana</label><input type="date" id="ini"></div>
      <div class="range" id="range"></div>
      <div class="ring">
        <div class="rw"><svg width="110" height="110" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#2b2823" stroke-width="10"/><circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="var(--gold)" stroke-width="10" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7" style="transition:stroke-dashoffset .5s"/></svg><b id="pct">0%</b></div>
        <div class="mu">da meta semanal<br>concluída</div>
      </div>
    </div>
    <div class="panel" style="display:flex;flex-direction:column;justify-content:center">
      <div class="big"><span id="done">0:00</span> <small>/ <span id="meta">25:00</span> h estudadas</small></div>
      <div class="prog"><span>Progresso</span><b id="pct2">0%</b></div>
      <div class="bar"><i id="fill"></i></div>
      <div class="mu" style="margin-top:12px">Faltam <b style="color:var(--gold)" id="left">25:00</b> h para bater a meta <span id="msg"></span></div>
    </div>
  </section>
  <section class="grid" id="grid"></section>
  <div class="foot"><button id="reset">Zerar esta semana</button></div>
</section>

<section class="page" id="p-historico">
  <h1>Histórico</h1>
  <p class="mu" style="margin:0">Cada semana vai do dia inicial até o sábado.</p>
  <div class="sum" id="sum"></div>
  <div class="panel"><div class="mu" style="font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.75rem">Horas por semana (últimas 10)</div><div class="chart" id="chart"></div></div>
  <div id="list"></div>
</section>
</main>

<script>
const DIAS=[
 {n:"Segunda",w:1,h:210,subs:["Legislação de Trânsito"],s:[["05:30","07:30",0],["12:00","12:30",0],["19:00","20:00",0]]},
 {n:"Terça",w:2,h:240,subs:["Português","Informática"],s:[["05:30","07:30",0],["12:00","12:30",0],["19:00","20:30",1]]},
 {n:"Quarta",w:3,h:210,subs:["Raciocínio Lógico-Matemático"],s:[["05:30","07:30",0],["12:00","12:30",0],["19:00","20:00",0]]},
 {n:"Quinta",w:4,h:240,subs:["Legislação de Trânsito","Física"],s:[["05:30","07:30",0],["12:00","12:30",0],["19:00","20:30",1]]},
 {n:"Sexta",w:5,h:240,subs:["Português","Direitos Humanos"],s:[["05:30","07:30",0],["12:00","12:30",0],["19:00","20:30",1]]},
 {n:"Sábado",w:6,h:360,subs:["Redação","Raciocínio Lógico-Matemático"],s:[["07:30","10:30",0],["12:00","15:00",1]]}
];
const R=["I","II"],$=i=>document.getElementById(i);
const m=t=>{const[a,b]=t.split(":");return +a*60+ +b};
const fmt=x=>Math.floor(x/60)+":"+String(x%60).padStart(2,"0");
DIAS.forEach(d=>d.s=d.s.map((x,i)=>({id:d.w+"-"+i,a:x[0],b:x[1],sub:x[2],min:m(x[1])-m(x[0])})));

const pd=k=>{const[y,mo,d]=k.split("-").map(Number);return new Date(y,mo-1,d)};
const ks=dt=>dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
const br=dt=>String(dt.getDate()).padStart(2,"0")+"/"+String(dt.getMonth()+1).padStart(2,"0")+"/"+dt.getFullYear();
const add=(dt,n)=>{const x=new Date(dt);x.setDate(x.getDate()+n);return x};
const endOf=k=>{const s=pd(k);return add(s,(6-s.getDay()+7)%7)};
const todayK=ks(new Date());
const mondayK=()=>{const t=new Date();return ks(add(t,-((t.getDay()+6)%7)))};

const KEY="rotina-estudos-v2";let S={sel:mondayK(),weeks:{}};
try{
  const r=localStorage.getItem(KEY);
  if(r)S=JSON.parse(r);
  else{const o=JSON.parse(localStorage.getItem("rotina-estudos-v1")||"{}");if(Object.keys(o).length)S.weeks[S.sel]={c:o}}
}catch(e){}
if(!S.weeks||!S.sel){S={sel:mondayK(),weeks:{}}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const wk=k=>S.weeks[k]||(S.weeks[k]={c:{}});
const inR=(k,w)=>w>=pd(k).getDay();
const goal=k=>DIAS.reduce((a,d)=>a+(inR(k,d.w)?d.h:0),0);
const mins=k=>{const c=(S.weeks[k]||{}).c||{};return DIAS.reduce((a,d)=>a+(inR(k,d.w)?d.s.reduce((b,x)=>b+(c[x.id]?x.min:0),0):0),0)};

function renderDays(){
  const k=S.sel,c=wk(k).c,s0=pd(k).getDay();
  $("grid").innerHTML=DIAS.map(d=>{
    const on=d.w>=s0,dt=add(pd(k),d.w-s0),multi=d.subs.length>1;
    let h=`<article class="day${on?"":" off"}${on&&ks(dt)===todayK?" today":""}" id="day${d.w}"><div class="ban">${on&&ks(dt)===todayK?'<span class="tag">HOJE</span>':""}<small>${on?br(dt)+" · META "+fmt(d.h)+" H":"FORA DA SEMANA"}</small><h2><em>${d.n}</em></h2></div><div class="body">`;
    h+=d.subs.map((s,i)=>`<p class="mat">${multi?R[i]+" – ":""}<b>${s}</b></p>`).join("");
    h+=`<div class="info">⏱ <span id="txt${d.w}"></span></div><div class="bar"><i id="bar${d.w}"></i></div>`;
    let last=-1;
    d.s.forEach(x=>{
      if(multi&&x.sub!==last){last=x.sub;h+=`<div class="blk">Bloco ${R[x.sub]} · <b>${d.subs[x.sub]}</b></div>`}
      h+=`<label class="s"><input type="checkbox" data-id="${x.id}" ${c[x.id]&&on?"checked":""}><span class="c"><span class="t">${x.a} → ${x.b}</span><span class="sj">${d.subs[x.sub]}</span></span><span class="d">${fmt(x.min)} h</span></label>`;
    });
    return h+"</div></article>";
  }).join("");
  $("ini").value=k;
  $("range").innerHTML=`Semana: <b>${br(pd(k))}</b> até <b>${br(endOf(k))}</b> (sábado)`;
  update();
}
function update(){
  const k=S.sel,c=wk(k).c;
  DIAS.forEach(d=>{
    if(!inR(k,d.w))return;
    const v=d.s.reduce((a,x)=>a+(c[x.id]?x.min:0),0),p=Math.round(v/d.h*100),b=$("bar"+d.w);
    b.style.width=p+"%";b.classList.toggle("full",p>=100);
    $("txt"+d.w).textContent=`${fmt(v)} de ${fmt(d.h)} h · ${p}%`;
  });
  const tot=mins(k),g=goal(k),p=Math.min(100,Math.round(tot/g*100));
  $("pct").textContent=p+"%";$("pct2").textContent=p+"%";
  $("done").textContent=fmt(tot);$("meta").textContent=fmt(g);$("left").textContent=fmt(Math.max(0,g-tot));
  $("fill").style.width=p+"%";$("fill").classList.toggle("full",p>=100);
  $("arc").style.strokeDashoffset=326.7*(1-p/100);
  $("arc").style.stroke=p>=100?"var(--ok)":"var(--gold)";
  $("msg").textContent=tot>=g?"· 🎉 Meta batida!":"";
}
function renderHist(){
  const keys=Object.keys(S.weeks).filter(k=>k===S.sel||mins(k)>0).sort().reverse();
  const tot=keys.reduce((a,k)=>a+mins(k),0),best=keys.reduce((a,k)=>Math.max(a,mins(k)),0);
  const ok=keys.filter(k=>mins(k)>=goal(k)).length;
  $("sum").innerHTML=[["Semanas",keys.length],["Total estudado",fmt(tot)+" h"],["Média por semana",fmt(keys.length?Math.round(tot/keys.length):0)+" h"],["Melhor semana",fmt(best)+" h"],["Metas batidas",ok]].map(x=>`<div class="panel"><span class="mu">${x[0]}</span><b>${x[1]}</b></div>`).join("");
  const last=keys.slice(0,10).reverse(),mx=Math.max(1500,...last.map(mins));
  $("chart").innerHTML=last.length?last.map(k=>{const v=mins(k);return `<div title="${fmt(v)} h">${fmt(v)}<i class="${v>=goal(k)?"full":""}" style="height:${Math.max(3,v/mx*90)}%"></i>${pd(k).getDate()}/${pd(k).getMonth()+1}</div>`}).join(""):'<div class="empty" style="width:100%">Sem dados ainda.</div>';
  $("list").innerHTML=keys.map(k=>{
    const v=mins(k),g=goal(k),p=Math.round(v/g*100);
    return `<div class="panel" style="margin-top:14px"><div class="wk"><div><h3>${br(pd(k))} → ${br(endOf(k))}${k===S.sel?'<span class="badge">SELECIONADA</span>':""}</h3><span class="mu">${fmt(v)} h de ${fmt(g)} h · <b style="color:${p>=100?"var(--ok)":"var(--gold)"}">${p}%</b></span></div><div class="acts"><button data-open="${k}">Abrir</button></div><div class="bar"><i class="${p>=100?"full":""}" style="width:${Math.min(100,p)}%"></i></div></div></div>`;
  }).join("")||'<div class="empty">Nenhuma semana registrada.</div>';
}
function go(p){
  document.querySelectorAll(".page").forEach(e=>e.classList.toggle("on",e.id==="p-"+p));
  document.querySelectorAll(".side a").forEach(e=>e.classList.toggle("on",e.dataset.p===p));
  if(p==="historico")renderHist();
  try{history.replaceState(null,"","#"+p)}catch(e){}
}
document.querySelector(".side").addEventListener("click",e=>{const a=e.target.closest("a");if(a)go(a.dataset.p)});
$("list").addEventListener("click",e=>{const k=e.target.dataset.open;if(k){S.sel=k;save();renderDays();go("rotina")}});
$("ini").addEventListener("change",e=>{if(!e.target.value)return;S.sel=e.target.value;wk(S.sel);save();renderDays()});
$("grid").addEventListener("change",e=>{
  const id=e.target.dataset.id;if(!id)return;
  const c=wk(S.sel).c;if(e.target.checked)c[id]=1;else delete c[id];
  save();update();
});
let armed=false;const rb=$("reset");
rb.onclick=()=>{
  if(!armed){armed=true;rb.textContent="Clique de novo para confirmar";rb.classList.add("armed");setTimeout(()=>{armed=false;rb.textContent="Zerar esta semana";rb.classList.remove("armed")},3000);return}
  wk(S.sel).c={};save();armed=false;rb.textContent="Zerar esta semana";rb.classList.remove("armed");renderDays();
};
wk(S.sel);renderDays();
if(location.hash==="#historico")go("historico");
</script>
</body>
</html>
